<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #menu { width: max-content; min-width: 200px; padding: 6px; background: rgba(252,252,253,0.98); border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.28); }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 7px 11px; font-size: 12.5px; color: #1d1d1f; border-radius: 8px; cursor: default; white-space: nowrap; }
  .item:hover { background: rgba(10,132,255,0.12); }
  .item.danger { color: #e0352b; }
  .item.danger:hover { background: rgba(255,59,48,0.1); }
  .sep { height: 1px; margin: 5px 10px; background: rgba(0,0,0,0.09); }
  .slider-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .slider-track { position: relative; flex: 1; min-width: 90px; height: 14px; border-radius: 7px; background: rgba(0,0,0,0.1); cursor: pointer; }
  .slider-fill { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: rgba(10,132,255,0.85); }
  .slider-thumb { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,0.12); box-shadow: 0 1px 4px rgba(0,0,0,0.25); }
  .slider-val { font-size: 10px; color: #0a84ff; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div id="menu"></div>
  <script src="menu.js"></script>
</body>
</html>
