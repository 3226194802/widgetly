<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Gradient Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="bg">
      <div class="glass" id="glass"></div>
      <div class="veil"></div>
    </div>
    <div class="content">
      <div class="time-row">
        <span class="digit d-a" id="h1">0</span>
        <span class="digit d-b" id="h2">0</span>
        <span class="colon"><i class="dot"></i><i class="dot"></i></span>
        <span class="digit d-a" id="m1">0</span>
        <span class="digit d-b" id="m2">0</span>
        <span class="ampm" id="ampm"></span>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
