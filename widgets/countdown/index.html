<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>倒数日·单目标</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-variant="single">
  <main class="card single" id="card">
    <div class="glass" id="glass"></div>
    <div class="veil"></div>
    <div class="noise"></div>
    <section class="single-content">
      <button class="hero-title" id="heroTitle" type="button" title="点击切换目标日期">
        <span id="heroName">添加目标日期</span><span class="hero-status" id="heroStatus">还有</span>
      </button>
      <div class="hero-number" id="heroNumber">＋</div>
      <div class="hero-unit" id="heroUnit">右键设置目标日期</div>
      <div class="today" id="todayText"></div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
