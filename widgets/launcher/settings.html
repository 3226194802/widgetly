<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>启动器设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .win { position: absolute; inset: 8px; border-radius: 16px; background: rgba(252,252,253,0.97); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 12px 32px rgba(0,0,0,0.28); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .head { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .title { font-size: 14px; font-weight: 800; color: #1d1d1f; }
  .close { width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; cursor: pointer; -webkit-app-region: no-drag; }
  .close:hover { background: rgba(0,0,0,0.08); }
  .row { display: flex; align-items: center; gap: 8px; }
  .label { font-size: 12px; font-weight: 700; color: #1d1d1f; flex: none; width: 74px; }
  .input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid rgba(0,0,0,0.12); border-radius: 8px; font-size: 12px; color: #1d1d1f; outline: none; background: #fff; font-family: inherit; }
  .input:focus { border-color: #0a84ff; }
  .hint { font-size: 10px; color: rgba(29,29,31,0.55); line-height: 1.6; }
  .hint b { color: #0a84ff; }
  .radio-group { flex: 1; display: flex; gap: 10px; }
  .radio { font-size: 12px; color: #3a3a3c; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .radio input { cursor: pointer; }
  .eye { flex: none; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,0.06); font-size: 11px; color: #555; cursor: pointer; }
  .foot { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { padding: 7px 18px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .btn.primary { background: #0a84ff; color: #fff; }
  .btn.primary:hover { background: #0066d6; }
  .btn.ghost { background: rgba(0,0,0,0.08); color: #1d1d1f; }
  .btn.ghost:hover { background: rgba(0,0,0,0.14); }
</style>
</head>
<body>
  <div class="win">
    <div class="head"><span class="title">启动器设置</span><span class="close" id="closeBtn">✕</span></div>
    <div class="row">
      <span class="label">DSH 安装路径</span>
      <input class="input" id="dshPath" placeholder="例如 D:\deepseek-harness">
    </div>
    <div class="hint">
      如何查找安装路径：打开 DeepSeek Harness 的安装文件夹，点击资源管理器顶部<b>地址栏</b>，复制完整路径粘贴到上方。<br>
      该路径下应能看到 <b>apps/cli/src/bin.ts</b> 文件（Hermes 项目的根目录）。
    </div>
    <div class="row">
      <span class="label">端口</span>
      <input class="input" id="port" type="number" placeholder="3080">
    </div>
    <div class="row">
      <span class="label">浏览器</span>
      <div class="radio-group">
        <label class="radio"><input type="radio" name="browser" value="default"> 系统默认</label>
        <label class="radio"><input type="radio" name="browser" value="edge"> Edge</label>
        <label class="radio"><input type="radio" name="browser" value="chrome"> Chrome</label>
      </div>
    </div>
    <div class="row">
      <span class="label">API Key</span>
      <input class="input" id="apiKey" type="password" placeholder="保存后可随时查看">
      <span class="eye" id="eye">显示</span>
    </div>
    <div class="foot">
      <button class="btn ghost" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
