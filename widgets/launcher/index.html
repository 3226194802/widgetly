<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DSH 启动器</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-size="medium">
  <div class="card" id="card">
    <div class="glass" id="glass"></div>
    <div class="bg"></div>
    <div class="content">
      <div class="brand">DeepSeek Harness</div>
      <div class="btn" id="btn" title="一键启动">
        <div class="glow"></div>
        <div class="ring"></div>
        <div class="core"><span class="icon" id="icon">▶</span></div>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span class="status-text" id="statusText">未启动</span></div>
      <div class="detail" id="detail"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
