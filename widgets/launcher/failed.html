<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>启动失败</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .win { position: absolute; inset: 8px; border-radius: 16px; background: rgba(252,252,253,0.98); border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 12px 32px rgba(0,0,0,0.28); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .head { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .title { font-size: 14px; font-weight: 800; color: #d6301f; }
  .close { width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; cursor: pointer; -webkit-app-region: no-drag; }
  .close:hover { background: rgba(0,0,0,0.08); }
  .list { flex: 1; min-height: 0; overflow-y: auto; font-size: 12px; color: #1d1d1f; line-height: 1.8; }
  .foot { display: flex; justify-content: flex-end; }
  .btn { padding: 7px 18px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; background: #0a84ff; color: #fff; font-family: inherit; }
  .btn:hover { background: #0066d6; }
</style>
</head>
<body>
  <div class="win">
    <div class="head"><span class="title">启动失败</span><span class="close" id="closeBtn">✕</span></div>
    <div class="list" id="list"></div>
    <div class="foot"><button class="btn" id="okBtn">知道了</button></div>
  </div>
  <script src="failed.js"></script>
</body>
</html>
