<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>指标设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .win {
    position: absolute; inset: 8px;
    border-radius: 16px;
    background: rgba(252, 252, 253, 0.98);
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    animation: winIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes winIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .head { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .title { font-size: 14px; font-weight: 800; color: #1d1d1f; }
  .close { width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; cursor: pointer; -webkit-app-region: no-drag; }
  .close:hover { background: rgba(0, 0, 0, 0.08); }
  .row { display: flex; align-items: center; gap: 10px; }
  #rows { display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 13px; font-weight: 700; color: #1d1d1f; width: 52px; flex: none; }
  select {
    flex: 1; padding: 8px 10px;
    border: 1px solid rgba(0, 0, 0, 0.14); border-radius: 9px;
    font-size: 13px; background: #fff; color: #1d1d1f; font-family: inherit; outline: none;
  }
  .tip { font-size: 11px; color: rgba(29, 29, 31, 0.5); line-height: 1.6; }
  .foot { display: flex; justify-content: flex-end; }
  .done { padding: 7px 22px; border: none; border-radius: 9px; background: rgba(0, 0, 0, 0.08); color: #1d1d1f; font-size: 13px; cursor: pointer; font-family: inherit; }
  .done:hover { background: rgba(0, 0, 0, 0.14); }
</style>
</head>
<body>
  <div class="win">
    <div class="head">
      <span class="title">指标设置</span>
      <span class="close" id="closeBtn" title="关闭">✕</span>
    </div>
    <div id="rows"></div>
    <div class="tip">在槽位中任选你要显示的指标（可重复）。GPU / 网络 / 电池需要 Windows 性能计数器支持，个别系统可能显示 "—"。</div>
    <div class="foot">
      <button class="done" id="doneBtn">完成</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
