<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>番茄设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .win {
    position: absolute; inset: 8px;
    border-radius: 18px;
    background: linear-gradient(168deg, rgba(56, 44, 38, 0.97), rgba(36, 28, 24, 0.98));
    border: 1px solid rgba(255, 240, 220, 0.14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 12px 32px rgba(0, 0, 0, 0.45);
    padding: 13px 15px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .title { font-size: 14px; font-weight: 800; color: #f1e8d8; letter-spacing: 0.5px; }
  .close { width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #b3a691; cursor: pointer; -webkit-app-region: no-drag; }
  .close:hover { background: rgba(255, 255, 255, 0.1); }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .label { font-size: 11.5px; color: #cfc3b0; flex: none; width: 58px; }
  .opts { flex: 1; display: flex; flex-wrap: wrap; gap: 5px; }
  .opt {
    padding: 4px 0; width: 44px; text-align: center;
    border: 1px solid rgba(255, 240, 220, 0.16); border-radius: 7px;
    background: rgba(255, 255, 255, 0.06);
    color: #e5dccb; font-size: 11.5px; cursor: pointer; font-family: inherit;
    transition: all 0.15s ease;
  }
  .opt:hover { background: rgba(255, 255, 255, 0.12); }
  .opt.sel { border-color: #ff6b52; background: rgba(255, 107, 82, 0.18); color: #ff8d78; font-weight: 600; }
  .opt.wide { width: auto; padding: 4px 12px; }
  .foot { display: flex; justify-content: flex-end; }
  .done { padding: 6px 20px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: #f1e8d8; font-size: 12px; cursor: pointer; font-family: inherit; }
  .done:hover { background: rgba(255, 255, 255, 0.16); }
</style>
</head>
<body>
  <div class="win">
    <div class="head">
      <span class="title">🍅 番茄设置</span>
      <span class="close" id="closeBtn" title="关闭">✕</span>
    </div>
    <div class="row">
      <span class="label">专注时长</span>
      <div class="opts" id="focusOpts"></div>
    </div>
    <div class="row">
      <span class="label">短休息</span>
      <div class="opts" id="shortOpts"></div>
    </div>
    <div class="row">
      <span class="label">长休息</span>
      <div class="opts" id="longOpts"></div>
    </div>
    <div class="row">
      <span class="label">长休息间隔</span>
      <div class="opts" id="everyOpts"></div>
    </div>
    <div class="row">
      <span class="label">选项</span>
      <div class="opts">
        <button class="opt wide" id="autoNext">自动开始下一轮</button>
        <button class="opt wide" id="soundOpt">完成提示音</button>
      </div>
    </div>
    <div class="foot">
      <button class="done" id="doneBtn">完成</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
