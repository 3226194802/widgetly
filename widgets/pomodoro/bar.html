<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>番茄时钟·中长条</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="bar.css">
</head>
<body data-phase="idle" data-ct="0">
  <div id="card">
    <div class="veil" id="veil"></div>

    <div class="bar">
      <!-- 左 3/5：事项列表 -->
      <div class="bar-left">
        <div class="bar-head">
          <span class="bar-logo">🍅</span>
          <span class="bar-title">番茄专注</span>
        </div>
        <div id="taskList"><!-- JS 填充 --></div>
      </div>

      <!-- 番茄色淡影竖线分隔 -->
      <div class="divider"></div>

      <!-- 右 2/5：计时 -->
      <div class="bar-right">
        <div class="br-phase" id="brPhase">待机</div>
        <div class="br-digits" id="brDigits">25:00</div>
        <div class="br-bar"><div class="br-fill" id="brFill"></div></div>
        <div class="br-task" id="brTask">—</div>
        <div class="br-ctrl">
          <button class="br-btn play-btn" id="btnPause" title="开始/暂停/继续">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.4 5.3c0-.9 1-1.45 1.76-.9l8.6 6.05c.68.48.68 1.52 0 2l-8.6 6.05c-.75.55-1.76 0-1.76-.9z"/></svg>
          </button>
          <button class="br-btn" id="btnReset" title="重置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5v6h6"/><path d="M4.6 11a8 8 0 1 1 1.4 6.3"/></svg>
          </button>
          <button class="br-btn" id="btnSkip" title="跳过休息" hidden>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.2 6.6v10.8a1 1 0 0 0 1.52.86l8.1-5.4a1 1 0 0 0 0-1.72l-8.1-5.4A1 1 0 0 0 4.2 6.6z"/><path d="M12.5 6.6v10.8a1 1 0 0 0 1.52.86l8.1-5.4a1 1 0 0 0 0-1.72l-8.1-5.4a1 1 0 0 0-1.52.86z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 背景透明度弹出面板 -->
    <div id="opPanel" hidden>
      <span class="op-label">背景透明度</span>
      <div class="op-controls">
        <div class="op-slider" id="opSlider">
          <div class="op-fill" id="opFill"></div>
          <div class="op-thumb" id="opThumb"></div>
        </div>
        <span class="op-val" id="opVal">45%</span>
      </div>
    </div>
  </div>
  <script src="bar.js"></script>
</body>
</html>
