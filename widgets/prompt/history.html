<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>历史对话</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#273047}.win{position:absolute;inset:8px;padding:15px;border-radius:18px;background:rgba(250,251,255,.98);border:1px solid rgba(50,69,110,.14);box-shadow:0 14px 40px rgba(13,20,45,.28);display:flex;flex-direction:column;gap:10px}.head{display:flex;align-items:center;justify-content:space-between;-webkit-app-region:drag}.title{font-size:15px;font-weight:800}.head-actions{display:flex;gap:4px;-webkit-app-region:no-drag}.icon-btn{border:0;border-radius:8px;padding:5px 8px;background:transparent;color:#68738c;font-size:11px;cursor:pointer}.icon-btn:hover{background:rgba(0,0,0,.07);color:#334c8d}.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}.empty{margin:auto;color:#8992a4;font-size:12px;text-align:center;line-height:1.7}.item{padding:10px;border:1px solid rgba(60,77,115,.12);border-radius:12px;background:#fff;box-shadow:0 2px 7px rgba(31,43,76,.04)}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;color:#7a8499;font-size:10px}.badge{padding:2px 6px;border-radius:5px;background:#edf1ff;color:#526bd0;font-weight:700}.source{font-size:12px;font-weight:700;color:#30394e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result{margin-top:5px;color:#687388;font-size:11px;line-height:1.45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.btn{border:1px solid rgba(73,93,141,.18);border-radius:7px;background:#fff;color:#5971ce;font-size:10px;padding:4px 8px;cursor:pointer}.btn:hover{background:#eff3ff}.btn.delete{color:#b35061}.btn.delete:hover{background:#fff0f1}.foot{display:flex;justify-content:space-between;align-items:center;color:#8b95a7;font-size:10px}.clear{border:0;background:transparent;color:#a55b68;font-size:10px;cursor:pointer}.clear:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="win">
    <div class="head"><span class="title">历史对话</span><div class="head-actions"><button class="icon-btn" id="clearBtn">清空历史</button><button class="icon-btn" id="closeBtn">✕</button></div></div>
    <div class="list" id="list"></div>
    <div class="foot"><span>历史仅保存在这台电脑，最多保留最近 30 条。</span><span id="count"></span></div>
  </div>
  <script src="history.js"></script>
</body>
</html>
