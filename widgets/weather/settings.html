<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>切换城市</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .win {
    position: absolute; inset: 8px;
    border-radius: 16px;
    background: rgba(252, 252, 253, 0.98);
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    animation: winIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes winIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .head { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .title { font-size: 14px; font-weight: 800; color: #1d1d1f; }
  .close { width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; cursor: pointer; -webkit-app-region: no-drag; }
  .close:hover { background: rgba(0, 0, 0, 0.08); }
  input {
    width: 100%; padding: 9px 12px;
    border: 1px solid rgba(0, 0, 0, 0.14); border-radius: 9px;
    font-size: 13px; background: #fff; color: #1d1d1f; font-family: inherit; outline: none;
  }
  input:focus { border-color: #5b9dff; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.06);
    color: #1d1d1f;
    font-size: 12px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .chip:hover { background: rgba(0, 0, 0, 0.12); }
  .tip { font-size: 11px; color: rgba(29, 29, 31, 0.5); line-height: 1.6; }
  .foot { display: flex; justify-content: flex-end; }
  .done { padding: 7px 22px; border: none; border-radius: 9px; background: #5b9dff; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }
  .done:hover { background: #4a8cef; }
</style>
</head>
<body>
  <div class="win">
    <div class="head">
      <span class="title">切换城市</span>
      <span class="close" id="closeBtn" title="关闭">✕</span>
    </div>
    <input id="cityInput" placeholder="输入城市名，如：北京 / 上海 / Tokyo" />
    <div class="chips" id="chips"></div>
    <div class="tip">数据来自 Open-Meteo 免费天气接口，需要联网；输入后回车或点「保存」立即刷新。</div>
    <div class="foot">
      <button class="done" id="doneBtn">保存</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
