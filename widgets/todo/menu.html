<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>menu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #menu {
    width: max-content; min-width: 188px;
    padding: 6px;
    background: rgba(252, 252, 253, 0.98);
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
  }
  .head { font-size: 10px; font-weight: 700; color: #9a9a9e; padding: 6px 12px 4px; }
  .item { padding: 8px 12px; font-size: 12.5px; color: #1d1d1f; border-radius: 8px; cursor: default; white-space: nowrap; }
  .item:hover { background: rgba(10, 132, 255, 0.12); }
  .item.danger { color: #e0352b; }
  .item.danger:hover { background: rgba(255, 59, 48, 0.1); }
  .sep { height: 1px; margin: 5px 10px; background: rgba(0, 0, 0, 0.09); }
</style>
</head>
<body>
  <div id="menu"></div>
  <script src="menu.js"></script>
</body>
</html>
