<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>应用待办日期</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .win {
    position: absolute; inset: 8px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .title { font-size: 14px; font-weight: 800; color: #1d1d1f; }
  .close { width: 24px; height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; cursor: pointer; -webkit-app-region: no-drag; }
  .close:hover { background: rgba(0, 0, 0, 0.08); }
  .todo-text {
    font-size: 13px; font-weight: 600; color: #0a5bd3;
    background: rgba(10, 132, 255, 0.08);
    border-radius: 9px; padding: 8px 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .days {
    flex: 1; min-height: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
  }
  .day-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px;
    border-radius: 9px;
    background: rgba(0, 0, 0, 0.03);
    cursor: pointer;
    font-size: 13px; color: #333;
  }
  .day-item:hover { background: rgba(0, 0, 0, 0.06); }
  .day-item input { accent-color: #0a84ff; }
  .all-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 9px;
    border-radius: 9px;
    background: rgba(10, 132, 255, 0.08);
    font-size: 13px; font-weight: 600; color: #0a5bd3;
    cursor: pointer;
  }
  .foot { display: flex; justify-content: flex-end; gap: 8px; }
  .btn {
    padding: 7px 18px; border: none; border-radius: 9px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .btn-ok { background: #0a84ff; color: #fff; }
  .btn-ok:hover { background: #0a74e6; }
  .btn-cancel { background: rgba(0, 0, 0, 0.08); color: #1d1d1f; }
  .btn-cancel:hover { background: rgba(0, 0, 0, 0.14); }
</style>
</head>
<body>
  <div class="win">
    <div class="head">
      <span class="title">应用此待办日期</span>
      <span class="close" id="closeBtn" title="关闭">✕</span>
    </div>
    <div class="todo-text" id="todoText"></div>
    <div class="days" id="days"></div>
    <div class="all-row" id="allRow">
      <input type="checkbox" id="allDays">
      <label for="allDays">应用到以后每一天</label>
    </div>
    <div class="foot">
      <button class="btn btn-cancel" id="cancelBtn">取消</button>
      <button class="btn btn-ok" id="okBtn">确认应用</button>
    </div>
  </div>
  <script src="apply.js"></script>
</body>
</html>
