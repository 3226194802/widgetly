<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Widgetly 组件坞</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 顶栏 -->
    <div class="topbar">
      <div class="brand">
        <img class="brand-logo" src="../assets/icon.png" alt="Widgetly">
        <div class="brand-name">Widgetly <span class="brand-sub">组件坞</span></div>
      </div>
      <div class="topbar-actions">
        <div class="opacity-ctl" title="背景透明度">
          <span class="op-icon">◐</span>
          <div class="op-track" id="opTrack">
            <div class="op-fill" id="opFill"></div>
            <div class="op-thumb" id="opThumb"></div>
          </div>
          <span class="op-val" id="opVal">78%</span>
        </div>
        <span class="tb-btn" id="btnSettings" title="设置">⚙</span>
        <span class="tb-btn" id="btnMinimize" title="最小化到托盘">—</span>
        <span class="tb-btn" id="btnClose" title="最小化到托盘">×</span>
      </div>
    </div>

    <!-- 主体：左侧导航 + 右侧卡片区 -->
    <div class="main">
      <div class="sidebar">
        <div class="search">
          <span class="search-icon">🔍</span>
          <input id="searchInput" type="text" placeholder="搜索组件">
        </div>
        <button class="mine-nav" id="mineNav" type="button">
          <span class="mine-nav-icon">✦</span>
          <span>我的小组件</span>
          <span class="mine-nav-count" id="mineNavCount" hidden>0</span>
        </button>
        <div class="nav" id="nav"><!-- JS 渲染分类 --></div>
      </div>
      <div class="content">
        <section class="library-view" id="libraryView">
          <div class="library-head">
            <div>
              <strong id="libraryTitle">全部组件</strong>
              <span id="resultCount">正在载入组件…</span>
            </div>
            <span class="library-tip">普通正方形 · 大正方形 · 单击添加</span>
          </div>
          <div class="grid" id="grid"><!-- JS 渲染 --></div>
          <div class="footbar">
            <span class="foot-hint">点击卡片添加 · 拖动同尺寸卡片排序 · 滚动查看</span>
            <span class="foot-ver">v0.2.0</span>
          </div>
        </section>
        <section class="my-widgets-view" id="myWidgetsView" hidden>
          <div class="library-head my-widgets-head">
            <div>
              <strong>我的小组件</strong>
              <span id="myWidgetsSummary">正在读取桌面上的组件…</span>
            </div>
            <button class="manage-widgets" id="manageWidgets" type="button">管理</button>
          </div>
          <div class="my-widgets-grid" id="myWidgetsGrid"></div>
          <div class="my-widgets-empty" id="myWidgetsEmpty" hidden>
            <span class="empty-symbol">✦</span>
            <strong>桌面上还没有小组件</strong>
            <p>到“全部组件”中挑选一个添加到桌面吧。</p>
          </div>
          <div class="footbar">
            <span class="foot-hint" id="myWidgetsFootHint">相同组件已自动合并显示</span>
            <span class="foot-ver">桌面组件</span>
          </div>
        </section>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
